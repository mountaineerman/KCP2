//Notes:
// Mappings between GameData\Squad\Parts\<part group>\<part>\<part>.cfg files and this file (see below):
//		moduleSource >> MODULE > name
//		title (Name as seen in-game)
//		actionGuiName >> experimentActionName



// Science Experiments and Crew Reports activated via action group Custom04 by default

//Command pods (spot-checked "Mk1 Command Pod" and "Mk1 Lander Can"):
//		name = ModuleScienceExperiment
//		experimentID = crewReport
//		experimentActionName = #autoLOC_502009 //#autoLOC_502009 = Crew Report
@PART[*]:HAS[@MODULE[ModuleScienceExperiment]] {
	@description ^= :(.)$:$0 Command pod Crew Report activated via action group Custom04 by default.:
	MODULE {
		name = ModuleDefaultActionGroup
		moduleSource = ModuleScienceExperiment
		actionGuiName = Crew Report
		defaultActionGroup = Custom04
	}
}

